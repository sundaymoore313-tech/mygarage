project_id = "mygarage"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:4173"]
# Production redirect URL is configured in Supabase Dashboard → Authentication → URL Configuration
jwt_expiry = 86400
enable_signup = true
enable_anonymous_sign_ins = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.create-stripe-checkout-session]
verify_jwt = true

[functions.create-stripe-portal-session]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.submit-feedback]
verify_jwt = false
